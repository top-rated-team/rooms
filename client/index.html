    <script>
      /* Render-blocking on purpose: the `dark` class must be on <html> before the
         first paint, or a dark-mode visitor gets a white flash. `@/hooks/use-theme`
         reads the same "tr-theme" key and trusts whatever this leaves behind. */
      (function () {
        try {
          var stored = localStorage.getItem("tr-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* Storage blocked (private mode, embedded webview): the CSS defaults to light. */
        }
      })();
    </script>
