# Render blueprint — one always-on Node process serving the API, the WebSocket
# and the built client.
#
# Why this shape and not a serverless one: the workspace at /w/:token is kept
# live over a WebSocket at /ws. A platform that starts the process per request
# (Vercel, Cloudflare Pages, Netlify) serves the landing page correctly and then
# the room loads and never updates, with no error anywhere. That failure is
# silent, which is why it is worth paying to avoid.
#
# To use it: render.com -> New -> Blueprint -> pick this repository. Render reads
# this file, creates the service, and asks only for the values marked sync:false
# below. Nothing here needs a terminal.
services:
  - type: web
    name: top-rated-team
    runtime: node
    plan: starter          # $7/month, 512 MB. Render now shows this as 0.5c-512mb;
                           # `starter` is its legacy name and still accepted. This is
                           # the COMPUTE price, not a workspace plan — stay on the
                           # free Hobby workspace, the $25 Pro tier buys nothing you
                           # need. The free compute plan sleeps after 15 minutes of no
                           # traffic — and Render counts messages on an already-open
                           # WebSocket as no traffic at all, so a busy room does not
                           # keep it awake. Use free only to look at it.
    region: frankfurt      # closest to the audience and to the owner
    branch: main
    # --include=dev is not optional: vite, esbuild and typescript are all
    # devDependencies, and npm skips those whenever NODE_ENV is production. A
    # build host that sets it — or a render.yaml that used to set it, as this one
    # did — gets `vite: not found` at the last step, after five minutes of work.
    #
    # The knowledge base is committed to the repository, so refreshing it is a
    # nice-to-have and must never fail the deploy: build-kb throws if a page it
    # fetches has moved, and a first deploy that dies on somebody else's website
    # is a bad first hour. Without an OpenAI key it skips the embedding step on
    # its own and retrieval falls back to keyword scoring.
    buildCommand: npm ci --include=dev && (npm run kb:build || echo "knowledge base not refreshed; using the committed copy") && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true       # a push to main deploys; turn this off in the dashboard
                           # if you would rather press the button yourself
    envVars:
      # NODE_ENV is deliberately NOT set here. Render applies these variables to
      # the BUILD as well as the run, and npm omits devDependencies when
      # NODE_ENV is production — which removes vite and esbuild, the two things
      # the build needs. The start script sets it for the process itself
      # (`NODE_ENV=production node dist/index.js`), which is where it belongs.
      #
      # PORT is set by Render itself. Do not add it here — server/index.ts already
      # reads process.env.PORT and binds 0.0.0.0.
      - key: PUBLIC_BASE_URL
        value: https://ai.top-rated.team
      - key: OPENAI_API_KEY
        sync: false        # paste it in the dashboard; never in this file
      - key: OPENAI_CHAT_MODEL
        value: gpt-5-mini
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      - key: LEAD_NOTIFY_EMAIL
        value: dan@being.marketing
      - key: LEAD_WEBHOOK_URL
        sync: false        # optional: where a request for a human is POSTed
      - key: DATABASE_URL
        sync: false        # Leave empty and rooms live in memory and vanish on every
                           # deploy, taking every room address you have handed out.
                           # Use a free Neon database, not Render's: server/db.ts
                           # imports drizzle-orm/neon-serverless and hands it the ws
                           # module, so it speaks Neon's protocol specifically.
                           # Render's own free Postgres also deletes itself after 30
                           # days.
      - key: LEAD_INBOX_KEY
        generateValue: true # Render invents one. It is the password for the page that
                            # lists every request for a person that has come in. Copy
                            # it out of the dashboard the first time; without it that
                            # page cannot be opened.
      - key: RESEND_API_KEY
        sync: false        # optional. Without it nothing sends email — requests still
                           # arrive and are stored, but only the inbox page and the
                           # webhook show them.
      - key: LEAD_EMAIL_FROM
        sync: false        # optional, and required if RESEND_API_KEY is set: the
                           # address the notification is sent from, on a domain
                           # verified with Resend.
